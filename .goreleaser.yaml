# GoReleaser configuration for ssh-agent-proxy.
# https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: ssh-agent-proxy
    main: .
    binary: ssh-agent-proxy
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Homebrew cask published to a personal tap.
# Requires a GitHub repo named "homebrew-tap" under the same owner and a token
# with write access exported as GITHUB_TOKEN (or HOMEBREW_TAP_GITHUB_TOKEN).
# A cask (rather than a formula) is used so Homebrew strips the macOS quarantine
# attribute on install, avoiding Gatekeeper warnings on the unsigned binary.
homebrew_casks:
  - name: ssh-agent-proxy
    repository:
      owner: krisiasty
      name: homebrew-tap
    homepage: "https://github.com/krisiasty/ssh-agent-proxy"
    description: "Filtering proxy for ssh-agent: expose per-group filtered views of your keys"
    caveats: |
      Configure ssh-agent-proxy, then install the LaunchAgent with:
        ssh-agent-proxy -install
      Config lives at ~/Library/Application Support/ssh-agent-proxy/config.yaml

release:
  draft: false
