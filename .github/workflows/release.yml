name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# External actions are pinned to full commit SHAs because this workflow runs
# with release credentials and tags are movable. The trailing comments identify
# the corresponding releases for human review and Dependabot updates. Downloaded
# tools use exact versions too.
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser needs full history and all tags for the changelog.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)" || { echo "unformatted files (run gofmt -w .)"; gofmt -l .; exit 1; }

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: License gate
        run: |
          ./hack/check-notices.sh
          go install github.com/google/go-licenses@v1.6.0
          go-licenses check . --disallowed_types=forbidden,restricted,unknown

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained token with Contents write access to krisiasty/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
